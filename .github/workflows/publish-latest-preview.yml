name: Publish latest GFSC preview

on:
  workflow_dispatch:
    inputs:
      as_of_date:
        description: "Catalogue cutoff (YYYY-MM-DD); blank uses the runner's current date"
        required: false
        type: string
      tiles:
        description: "Optional space-separated MGRS tiles; blank uses the full MVP area"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: publish-latest-gfsc-preview
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish newest products
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate R2 configuration
        run: |
          : "${R2_ACCOUNT_ID:?Set the R2_ACCOUNT_ID repository variable}"
          : "${R2_BUCKET:?Set the R2_BUCKET repository variable}"
          : "${R2_PUBLIC_BASE_URL:?Set the R2_PUBLIC_BASE_URL repository variable}"
          : "${R2_ACCESS_KEY_ID:?Set the R2_ACCESS_KEY_ID repository secret}"
          : "${R2_SECRET_ACCESS_KEY:?Set the R2_SECRET_ACCESS_KEY repository secret}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install pipeline dependencies
        run: python -m pip install --requirement pipeline/requirements.txt

      - name: Build and publish preview
        env:
          AS_OF_DATE: ${{ inputs.as_of_date }}
          REQUESTED_TILES: ${{ inputs.tiles }}
        run: |
          args=(
            --raw-dir "${RUNNER_TEMP}/gfsc-raw"
            --work-dir "${RUNNER_TEMP}/gfsc-work"
            --output-dir "${RUNNER_TEMP}/gfsc-output"
            --publish-r2
          )
          if [[ -n "${AS_OF_DATE}" ]]; then
            args+=(--as-of "${AS_OF_DATE}")
          fi
          if [[ -n "${REQUESTED_TILES}" ]]; then
            read -r -a tiles <<< "${REQUESTED_TILES}"
            args+=(--tiles "${tiles[@]}")
          fi
          python -m pipeline.preview "${args[@]}"

      - name: Verify published pointer
        run: |
          curl --fail --show-error --retry 5 \
            --output "${RUNNER_TEMP}/published-latest.json" \
            "${R2_PUBLIC_BASE_URL%/}/latest.json"
          python -c 'import json, os; p=os.environ["RUNNER_TEMP"] + "/published-latest.json"; d=json.load(open(p)); assert d["mode"] == "latest-product-only-preview"; assert d["tiles"]'

      - name: Preserve publication metadata
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: latest-gfsc-preview-metadata
          path: |
            ${{ runner.temp }}/published-latest.json
            ${{ runner.temp }}/gfsc-output/runs/*/run.json
          if-no-files-found: error
          retention-days: 7
